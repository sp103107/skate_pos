[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skate-checkout-pos"
version = "0.1.0"
description = "Skate POS K01 independent demo-only cart and checkout ledger"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["checkout_pos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
